# Phase 5-2: 검란 분류기 (MONO 투광 크롭, 정상 소분류 4종 + 혈반 소분류 5종 = 9 클래스)
# 혈반 소분류 코드 가설: 3/1 혈반육반, 3/5 먹통, 3/2·3/3·3/4 = 중앙기실·알끈·거품 중 하나
name: cls_candling_effb0
light: MONO
label_col: cls
class_filter: ["1/", "3/"]
model: efficientnet_b0
img_size: 256
batch: 96
epochs: 5
lr: 0.0006
weight_decay: 0.01
label_smoothing: 0.05
loss: weighted_ce
preprocess: none               # Phase 5-4 ablation: none | clahe | unsharp
train_cap_per_class: 12000
val_max: 8000
test_max: null
workers: 8
seed: 42
group_cols: [washed, breed, region_code]
index_csv: data/crops/index.csv
