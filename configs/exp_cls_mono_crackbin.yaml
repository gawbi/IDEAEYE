# 후속: 크랙(2) vs 정상(1) 2 클래스 — 파각 운영점(Recall 95% 에서 정상 FPR) 직접 최적화
name: cls_mono_crackbin_effb0
light: MONO
label_col: state
class_filter: ["1/", "2/"]
model: efficientnet_b0
img_size: 320
batch: 64
epochs: 8
lr: 0.0006
weight_decay: 0.01
label_smoothing: 0.0
loss: weighted_ce
preprocess: none
train_cap_per_class: 50000
val_max: 12000
test_max: null
workers: 8
seed: 42
group_cols: [washed, breed, region_code]
index_csv: data/crops/index.csv
