# 후속: 정상(1) / 크랙(2) / 기타결함(9: 혈반·탈색·이물질·기형) 3클래스 — 라인 유입 분포에 가까운 음성 집합으로 파각 운영점 재확인
name: cls_mono_3cls_effb0
