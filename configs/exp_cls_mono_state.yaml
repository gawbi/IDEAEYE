# 후속: MONO 대분류(6 클래스, state 코드) 분류기 — 배출 판정은 대분류로 충분한지 확인
name: cls_mono_state_effb0
light: MONO
label_col: state
model: efficientnet_b0
img_size: 256
batch: 96
epochs: 6
lr: 0.0006
weight_decay: 0.01
label_smoothing: 0.05
loss: weighted_ce
preprocess: none
train_cap_per_class: 40000
val_max: 12000
test_max: null
workers: 8
seed: 42
group_cols: [washed, breed, region_code]
index_csv: data/crops/index.csv
